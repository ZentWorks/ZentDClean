services:
  zentdclean:
    build: .
    container_name: zentdclean
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: "Europe/Berlin"
      # Optional: set PASSWORD to enable the login.
      # PASSWORD: "change-me"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
